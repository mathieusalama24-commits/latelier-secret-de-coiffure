<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>L'Atelier Secret de Coiffure — Coloriste à Argenteuil</title>
    <meta
      name="description"
      content="Salon de coiffure 100 % féminin et sans vis-à-vis à Argenteuil. Balayage, ombré hair, patine, lissage brésilien, chignon et maquillage de mariée. 4,97/5 sur 124 avis."
    />
    <link rel="canonical" href="https://latelier-secret-de-coiffure.netlify.app/" />
    <meta name="theme-color" content="#f5efe6" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="L'Atelier Secret de Coiffure — Coloriste à Argenteuil" />
    <meta
      property="og:description"
      content="Salon 100 % féminin et sans vis-à-vis, à 6 min à pied de la gare d'Argenteuil. Spécialiste du balayage et de l'ombré hair."
    />
    <meta property="og:image" content="https://latelier-secret-de-coiffure.netlify.app/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://latelier-secret-de-coiffure.netlify.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/BodoniModa-400-normal-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Jost-400-normal-latin.woff2" crossorigin />

    <link rel="preload" as="image" href="/images/hero-balayage-dore.webp" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "L'Atelier Secret de Coiffure",
        "description": "Salon de coiffure 100 % féminin et sans vis-à-vis à Argenteuil, spécialisé en coloration, balayage, ombré hair et lissage brésilien.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "69 rue Alfred Labrière",
          "addressLocality": "Argenteuil",
          "postalCode": "95100",
          "addressCountry": "FR"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 48.948265, "longitude": 2.253579 },
        "areaServed": ["Argenteuil", "Bezons", "Cormeilles-en-Parisis", "Sartrouville"],
        "telephone": "+33662723849",
        "priceRange": "€€",
        "image": "https://latelier-secret-de-coiffure.netlify.app/og-cover.jpg",
        "sameAs": ["https://www.instagram.com/lateliersecretcoiffure/"],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.97",
          "reviewCount": "124",
          "bestRating": "5"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Balayage" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ombré hair" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Coloration" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Lissage brésilien" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Chignon et maquillage de mariée" } }
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Faut-il prendre rendez-vous ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, le salon reçoit uniquement sur rendez-vous, du mardi au samedi. C'est ce qui permet de n'avoir qu'une seule cliente à la fois."
            }
          },
          {
            "@type": "Question",
            "name": "Combien de temps prévoir pour un balayage ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Entre 3 h et 3 h 30 selon la longueur, shampooing, coupe et brushing compris. Comptez 1 h 40 pour une couleur, 1 h 30 pour un soin botox et 3 h pour un lissage brésilien."
            }
          },
          {
            "@type": "Question",
            "name": "Comment accéder au salon ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Le salon se trouve à l'intérieur de la Résidence Floréal, au 69 rue Alfred Labrière : il n'y a pas de vitrine sur rue. Comptez 6 minutes à pied depuis la gare d'Argenteuil."
            }
          },
          {
            "@type": "Question",
            "name": "Mes cheveux sont abîmés, puis-je quand même faire une couleur ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "C'est justement le cas de figure prévu : pour toute coloration, balayage ou ombré hair, un soin profond Métal Detox ou K18 est proposé afin de limiter la casse sur une fibre déjà sensibilisée."
            }
          },
          {
            "@type": "Question",
            "name": "Coiffez-vous les mariées ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, chignon et maquillage, par la même personne et le même jour. Les invitées peuvent être prises en charge dans la foulée. Ces dates se réservent longtemps à l'avance."
            }
          },
          {
            "@type": "Question",
            "name": "Proposez-vous des formations ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, à la coiffure et au maquillage. Le programme, les dates et les modalités sont communiqués sur demande."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Formulaire statique de détection pour Netlify Forms.
      Netlify analyse le HTML généré au build, pas le DOM rendu par React :
      sans ce doublon caché, le formulaire de la page n'est jamais détecté.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <input type="tel" name="telephone" />
      <input type="text" name="prestation" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
